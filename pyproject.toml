[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceharbor-observability-demo"
version = "0.1.0"
description = "A production-minded telemetry ingest service and zero-dependency Python SDK"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kadir Demir"}]
keywords = ["observability", "telemetry", "error-monitoring", "developer-tools"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.scripts]
traceharbor = "traceharbor.server:main"

[tool.setuptools]
packages = ["traceharbor", "traceharbor_sdk"]

[tool.setuptools.package-data]
traceharbor = ["static/*"]
