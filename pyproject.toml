[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "traceharbor-observability-demo"
version = "0.2.0"
description = "A production-minded telemetry and CI artifact-analysis service"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Kadir Demir"}]
keywords = ["observability", "telemetry", "snapshot-testing", "ci", "developer-tools"]
dependencies = ["Pillow>=10.4,<13"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.optional-dependencies]
dev = [
  "coverage[toml]>=7.6,<8",
  "mypy>=1.11,<2",
  "ruff>=0.7,<1",
]

[project.scripts]
traceharbor = "traceharbor.server:main"

[tool.setuptools]
packages = ["traceharbor", "traceharbor_sdk"]

[tool.setuptools.package-data]
traceharbor = ["static/*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.mypy]
python_version = "3.11"
check_untyped_defs = true
disallow_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true

[tool.coverage.run]
branch = true
source = ["traceharbor", "traceharbor_sdk"]

[tool.coverage.report]
show_missing = true
skip_covered = true
