name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install project and quality tools
        run: python -m pip install -e ".[dev]"
      - name: Compile source
        run: python -m compileall -q traceharbor traceharbor_sdk examples tests
      - name: Lint
        run: ruff check traceharbor traceharbor_sdk examples tests
      - name: Type check
        run: mypy traceharbor traceharbor_sdk
      - name: Test with branch coverage
        run: |
          coverage run -m unittest discover -v
          coverage report --fail-under=70

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build container
        run: docker build --tag traceharbor:ci .

